name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Briefs, CI logs, pictures and timelines
        working-directory: mods/github
        run: for t in *.test.mjs; do node "$t"; done
      - name: "Git panel: parsers and git calls against real repositories"
        working-directory: mods/git
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          for t in *.test.mjs; do node "$t"; done
